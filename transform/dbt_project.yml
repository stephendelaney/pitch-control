name: pitch_control
version: "1.0.0"
config-version: 2

profile: pitch_control

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

# Silver is materialized as Parquet in the lake, not as tables inside a DuckDB file
# (ADR-0003: Silver/Gold are Parquet on S3; ADR-0004: the engine is ephemeral and owns no
# storage). dbt-duckdb's `external` materialization writes the Parquet and then defines a view
# over it, so `ref()` keeps working for downstream models and tests while the artifact that
# actually persists is the file in the lake.
#
# The write path is `external_root` from profiles.yml + `<model>.parquet`, which is why Silver
# needs no `location` at all. `external_root` is a single value per target, so Gold — which
# lands under `<lake>/gold` — cannot be served by it and each Gold model calls
# `{{ config(location=gold_location()) }}` in its own header instead.
#
# It has to be per-model rather than a `+location` here: dbt renders dbt_project.yml at project
# load, before user macros exist (`'gold_location' is undefined`) and with no `this` to name the
# file — so every model would collide on one path even if the macro resolved. `gold_location()`
# reads the same PITCH_CONTROL_LAKE_BUCKET switch profiles.yml does, so one env var still moves
# the whole project between the lake and local disk.
models:
  pitch_control:
    silver:
      +materialized: external
      +format: parquet
      +schema: silver
    gold:
      +materialized: external
      +format: parquet
      +schema: gold
