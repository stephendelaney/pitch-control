# B5 / ADR-0022 layer 3 — CI backstop, no AWS credentials required.
#
# Two independent guards run on every PR into main (and pushes to main):
#   1. terraform fmt -check + validate — offline (init -backend=false), so it needs no cloud
#      access and no state. Catches formatting drift and config errors before review.
#   2. gitleaks — full-history secret scan. Server-side backstop for the local pre-commit gate
#      (.pre-commit-config.yaml) and GitHub push protection: a hook bypassed with --no-verify
#      still surfaces here. Pinned to the same gitleaks version as the pre-commit hook.
#
# This workflow also stands up the Actions skeleton that Wk 2 (dlt ingest) builds on.
#
# Actions are SHA-pinned and the gitleaks binary is checksum-verified (see below). Both matter
# more here than the absence of credentials suggests: this is the job that *is* the security
# backstop, and a scanner that has been silently swapped still exits 0. A compromised guard
# reports success — which is worse than having no guard, because it is trusted.
name: terraform-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: fmt + validate (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          # Matches the maintainer's local Terraform. Must stay >= 1.10 — versions.tf sets
          # that floor for the S3 backend's `use_lockfile` (B6), and 1.9.x now fails init.
          terraform_version: "1.15.6"

      # fmt across the whole tree (recursive) so nested dirs (e.g. sql/) are covered.
      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      # Offline validate: no backend, no provider credentials, no state.
      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the scan covers every commit, not just the PR tip.
          fetch-depth: 0

      # Pin to the pre-commit hook's version (.pre-commit-config.yaml) for parity. Download the
      # binary directly rather than the marketplace action to avoid its org-license/telemetry
      # path — the CLI is Apache-2.0 and free for any use.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          # SHA256 of gitleaks_<version>_linux_x64.tar.gz, checked against the release's
          # published checksums file on 2026-08-04.
          #
          # Hardcoded rather than fetched at run time, which is the whole point: a checksums
          # file downloaded from the same release proves nothing, because anyone able to
          # replace the artifact can replace the checksums beside it. The integrity claim has
          # to live somewhere the attacker does not control — here, under review, in git.
          #
          # A version bump must bump this too. That is deliberate friction: it is exactly the
          # moment to re-verify, and a mismatch failing the build is the correct outcome.
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          set -euo pipefail
          # To a file, not through a pipe: `curl | tar` executes the archive's contents before
          # anything could have verified them, so there is no point at which a check could be
          # inserted. Verify first, extract second.
          curl -sSfL --max-time 60 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
