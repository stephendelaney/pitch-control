# CI guard for ingest/ — the Python half of the B5 backstop.
#
# `ingest-bronze.yml` runs these same tests, but only on its 06:00 schedule or a manual
# dispatch. Without this workflow a PR that breaks gameweek selection merges green and is
# discovered by a failed unattended run the next morning. Same reasoning as terraform-check:
# catch it at review time, not in production.
#
# No AWS credentials and no network. The FPL half is tested against hand-built fixtures
# (ADR-0011 — never make the suite depend on an unofficial API being up); the Postgres half
# reflects an in-memory SQLite database through the same SQLAlchemy path RDS uses, so it needs
# no database server, no credential, and no open security group.
#
# Actions are SHA-pinned (see ingest-bronze.yml). There is no credential here to steal, but this
# workflow runs on `pull_request` — including from forks — so it is the one place where the
# runner already executes untrusted code. Pinning removes the second untrusted input.
name: ingest-check

on:
  pull_request:
    branches: [main]
    paths:
      - "ingest/**"
      - ".github/scripts/sg-ephemeral.sh"
      - ".github/scripts/ops_ledger.py"
      - ".github/workflows/ingest-check.yml"
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - ".github/scripts/sg-ephemeral.sh"
      - ".github/scripts/ops_ledger.py"
      - ".github/workflows/ingest-check.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: ingest unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Keep in lockstep with ingest-bronze.yml — testing on a different interpreter to
          # the one that runs the job defeats the point.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ingest/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -q

      # Cheap import check: catches a syntax error or bad import in the modules the tests do
      # not fully exercise — `fpl.source` in particular is only reached by the scheduled run.
      - name: Import check
        run: |
          python -c "import run_fpl, fpl.source, run_postgres, postgres.source, run_metrics; \
                     print('ingest modules import cleanly')"

      # The SG script is bash, so nothing above would notice a syntax error in it — and it is
      # the one piece of this system whose failure mode is "5432 left open", discovered at
      # 06:00. `bash -n` is a parse-only check: it costs nothing and it cannot execute a
      # single AWS call.
      - name: Shell syntax check
        working-directory: .
        run: bash -n .github/scripts/sg-ephemeral.sh
