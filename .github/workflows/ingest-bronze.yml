# Wk 2 — Bronze ingestion (ADR-0007 orchestration, ADR-0010 dlt, ADR-0011 FPL source).
#
# Two independent sources, two jobs, one schedule:
#
#   fpl       -> s3://<lake>/bronze/fpl/        public HTTPS, no secret, no network setup
#   postgres  -> s3://<lake>/bronze/postgres/   RDS, needs ADR-0021 ingress + ADR-0019 secret
#
# Both assume the dedicated runtime ingest identity (`infra/iam_ingest.tf`, ADR-0020) — which
# can write bronze/* and nothing else. Deliberately NOT `tf-apply`: these are data-plane jobs,
# and a bug in one must not be able to reshape the account.
#
# The jobs are independent on purpose (no `needs:`). FPL is an unofficial third-party API
# (ADR-0011) and RDS is our own instance; a bad afternoon for one is not a reason to skip the
# other, and coupling them would make every FPL outage look like a database failure.
#
# Cost: $0. Actions minutes are unmetered on public repos, and the load is a few MB of S3
# PUTs a day — immaterial against the free-plan drawdown tracked in docs/STATUS.md.
#
# Third-party actions are pinned to a full commit SHA, with the version as a trailing comment.
# A tag is a mutable pointer the action's owner can move at any time, and these jobs hand
# `configure-aws-credentials` an OIDC token that it exchanges for real AWS credentials — so a
# moved tag is credential theft, not a broken build. The SHA is the only immutable reference
# GitHub offers. Bump deliberately (re-resolve the tag, read the diff), never automatically.
name: ingest-bronze

on:
  schedule:
    # 06:00 UTC daily. FPL settles overnight — prices move ~01:30 UTC and post-match bonus and
    # stat corrections land well before dawn — so a morning run sees a stable picture. Daily is
    # the polite low-frequency cadence ADR-0011 commits to for an unofficial API; capturing
    # points *during* matches would need a tighter in-play schedule, which is a deliberate
    # later decision, not an oversight. Nothing is lost by waiting: the gameweek-selection rule
    # keeps re-fetching anything that can still change.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Gameweeks to force-load live points for, e.g. '1-38' or '5,7'. Blank = automatic."
        required: false
        type: string

permissions:
  # Required to mint the OIDC token that `configure-aws-credentials` exchanges for the role.
  # Keyless — no long-lived AWS access key exists anywhere (ADR-0009).
  id-token: write
  contents: read

# Bronze is append-only (ADR-0003), so two overlapping runs would not corrupt anything — they
# would just write duplicate observations and double the request rate against an unofficial
# API. Queue instead of cancelling: a run already talking to FPL should finish cleanly.
#
# `cancel-in-progress: false` is load-bearing for the Postgres job specifically. A cancelled
# runner is hard-killed, which is the one way the `if: always()` revoke gets skipped — so
# cancellation is precisely how ADR-0021's orphaned-rule failure mode happens. Queueing means
# the platform never creates that situation on our behalf.
concurrency:
  group: ingest-bronze
  cancel-in-progress: false

jobs:
  fpl:
    name: FPL -> Bronze
    runs-on: ubuntu-latest
    # A normal run is ~15s. This is a stuck-network guard, not a budget — it exists so a
    # hung request cannot sit on a runner for six hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Pinned minor, not "3.x": this job runs unattended, and a silent interpreter bump
          # is not something we want to discover from a failed 06:00 run.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ingest/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The selection rule is pure and hits no network (see ingest/fpl/gameweeks.py), so it
      # is cheap to assert before spending an AWS credential or an FPL request on the run.
      - name: Unit tests
        run: pytest -q

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_INGEST_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: ingest-bronze-${{ github.run_id }}

      - name: Load FPL into Bronze
        env:
          # Presence of this variable is what switches the pipeline from a local dry run to
          # S3 (see ingest/run_fpl.py). If the repo variable were ever unset, the job would
          # quietly write to the runner's disk and report success — so assert it first.
          PITCH_CONTROL_LAKE_BUCKET: ${{ vars.PITCH_CONTROL_LAKE_BUCKET }}
          # Bound through the environment rather than interpolated into the script with
          # ${{ }}. `workflow_dispatch` inputs are attacker-controlled text as far as the
          # runner is concerned, and direct interpolation would splice them into the shell
          # before bash ever quotes them — the standard Actions script-injection footgun.
          # Dispatch here needs write access, so this is defence in depth, not a live hole.
          BACKFILL: ${{ inputs.backfill }}
        run: |
          set -euo pipefail
          if [ -z "${PITCH_CONTROL_LAKE_BUCKET}" ]; then
            echo "::error::PITCH_CONTROL_LAKE_BUCKET repo variable is not set — refusing to run."
            echo "Set it to the lake bucket name (terraform output -raw lake_bucket)."
            exit 1
          fi
          if [ -n "${BACKFILL}" ]; then
            # Quoted, so it arrives as one argv entry; run_fpl.py validates the format and
            # rejects anything outside GW 1-38.
            python run_fpl.py --backfill "${BACKFILL}"
          else
            python run_fpl.py
          fi

  postgres:
    name: Postgres -> Bronze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      # `gh run view`, used by the start-of-run sweep to tell an orphaned ephemeral rule from
      # one a concurrent run legitimately owns. Read-only, and scoped to this job rather than
      # the workflow because the FPL job has no business reading run metadata.
      actions: read
    defaults:
      run:
        working-directory: ingest

    env:
      # Must match `terraform output -raw rds_password_ssm_parameter` (ADR-0019). Not a repo
      # variable: it is derived from constants (project + environment) and a mismatch fails
      # loudly with ParameterNotFound rather than doing something subtle.
      SSM_PASSWORD_PARAMETER: /pitch-control/dev/rds/password
      # The DB instance identifier is stable across a destroy/recreate; the endpoint is not.
      # Resolving the endpoint from the identifier at run time is what keeps this job working
      # after the teardown/rebuild cycles the free-plan cost posture encourages.
      DB_INSTANCE_IDENTIFIER: pitch-control-pg
      SG_NAME_TAG: pitch-control-rds
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ingest/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Asserted before anything expensive or exposing happens. This job opens a hole in a
      # security group; discovering a broken pipeline *after* that is the wrong order.
      - name: Unit tests
        run: pytest -q

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_INGEST_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: ingest-postgres-${{ github.run_id }}

      # Self-healing: if a previous run was hard-killed before its revoke, its rule is still
      # open. Sweeping here means the next scheduled run closes it without anyone noticing —
      # the scheduled janitor exists for the case where there *is* no next run.
      - name: Sweep orphaned ephemeral SG rules
        run: $GITHUB_WORKSPACE/.github/scripts/sg-ephemeral.sh sweep

      - name: Open ephemeral SG ingress for this runner
        run: $GITHUB_WORKSPACE/.github/scripts/sg-ephemeral.sh open

      # `*.pem` is gitignored, so the bundle cannot be read from the repo — it must be
      # fetched. That is not a workaround: pinning a CA bundle into a public repo is how you
      # end up trusting an expired root long after AWS has rotated it.
      - name: Fetch the RDS CA bundle
        run: |
          set -euo pipefail
          curl -sSf --max-time 30 -o "$RUNNER_TEMP/global-bundle.pem" \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          # A proxy error page would also be a 200 with a body; verify it is really a cert
          # before handing it to libpq, which reports a bad bundle as a vague TLS failure.
          openssl x509 -in "$RUNNER_TEMP/global-bundle.pem" -noout -subject >/dev/null

      # The secret is fetched and used inside ONE step, so it never reaches $GITHUB_ENV, a
      # file, or another step's environment. This is the ADR-0019 runtime path end to end:
      # 1Password seeded it, SSM holds it, the role's own OIDC credentials read it, and it
      # lives only in this process.
      - name: Load Postgres into Bronze
        env:
          PITCH_CONTROL_LAKE_BUCKET: ${{ vars.PITCH_CONTROL_LAKE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${PITCH_CONTROL_LAKE_BUCKET}" ]; then
            echo "::error::PITCH_CONTROL_LAKE_BUCKET repo variable is not set — refusing to run."
            exit 1
          fi

          PITCH_CONTROL_PG_HOST="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_INSTANCE_IDENTIFIER" \
            --query 'DBInstances[0].Endpoint.Address' --output text)"
          export PITCH_CONTROL_PG_HOST
          echo "RDS endpoint: ${PITCH_CONTROL_PG_HOST}"

          PITCH_CONTROL_PG_PASSWORD="$(aws ssm get-parameter \
            --name "$SSM_PASSWORD_PARAMETER" --with-decryption \
            --query 'Parameter.Value' --output text)"
          export PITCH_CONTROL_PG_PASSWORD
          # NOT belt and braces — this is the only masking there is. GitHub automatically
          # masks values that came from its own secrets store; this one comes from SSM at run
          # time (ADR-0019), so nothing masks it unless we say so. A public repo's logs are
          # world-readable the moment they are written.
          echo "::add-mask::${PITCH_CONTROL_PG_PASSWORD}"

          # `add-mask` matches a literal string. Anything that renders the password in a
          # *transformed* form slips straight past it — and assembling a DSN percent-encodes
          # it, which is the one transformation on this job's actual code path.
          #
          # `PostgresTarget` avoids that today by handing SQLAlchemy's URL object around
          # (it renders `***`), but that is one library's behaviour, not an invariant, and the
          # failure mode is a password in a public log rather than an error. Masking the
          # encoded form as well costs nothing and does not depend on that behaviour holding.
          #
          # Only when it differs: for a password with no reserved characters the two strings
          # are identical, and masking the same value twice just adds noise.
          PG_PASSWORD_URLENC="$(python -c \
            'import os, urllib.parse; print(urllib.parse.quote(os.environ["PITCH_CONTROL_PG_PASSWORD"], safe=""))')"
          if [ "$PG_PASSWORD_URLENC" != "$PITCH_CONTROL_PG_PASSWORD" ]; then
            echo "::add-mask::${PG_PASSWORD_URLENC}"
          fi
          unset PG_PASSWORD_URLENC

          export PITCH_CONTROL_PG_SSLROOTCERT="$RUNNER_TEMP/global-bundle.pem"
          python run_postgres.py

      # The first line of defence (ADR-0021). `always()` so it runs when the load fails, when
      # the CA fetch fails, and when the job is cancelled mid-step — every path except a
      # hard-killed runner, which is exactly what the sweep and the janitor are for.
      - name: Revoke ephemeral SG ingress
        if: always()
        run: $GITHUB_WORKSPACE/.github/scripts/sg-ephemeral.sh close
