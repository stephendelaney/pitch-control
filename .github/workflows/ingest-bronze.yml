# Wk 2 — Bronze ingestion (ADR-0007 orchestration, ADR-0010 dlt, ADR-0011 FPL source).
#
# FPL -> s3://<lake>/bronze/fpl/. This is the first job in the repo that assumes an AWS role
# to move data rather than to manage infrastructure, so it runs as the dedicated runtime
# ingest identity (`infra/iam_ingest.tf`, ADR-0020) — which can write bronze/* and nothing
# else. It is deliberately NOT `tf-apply`.
#
# No security-group dance here: FPL is a public HTTPS endpoint, so the runner needs only
# outbound internet and an S3 write. ADR-0021's ephemeral runner-IP ingress is required by the
# *Postgres* -> S3 job, which lands separately and brings its own `always()` revoke + janitor.
#
# Cost: $0. Actions minutes are unmetered on public repos, and the load is a few MB of S3
# PUTs a day — immaterial against the free-plan drawdown tracked in docs/STATUS.md.
name: ingest-bronze

on:
  schedule:
    # 06:00 UTC daily. FPL settles overnight — prices move ~01:30 UTC and post-match bonus and
    # stat corrections land well before dawn — so a morning run sees a stable picture. Daily is
    # the polite low-frequency cadence ADR-0011 commits to for an unofficial API; capturing
    # points *during* matches would need a tighter in-play schedule, which is a deliberate
    # later decision, not an oversight. Nothing is lost by waiting: the gameweek-selection rule
    # keeps re-fetching anything that can still change.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Gameweeks to force-load live points for, e.g. '1-38' or '5,7'. Blank = automatic."
        required: false
        type: string

permissions:
  # Required to mint the OIDC token that `configure-aws-credentials` exchanges for the role.
  # Keyless — no long-lived AWS access key exists anywhere (ADR-0009).
  id-token: write
  contents: read

# Bronze is append-only (ADR-0003), so two overlapping runs would not corrupt anything — they
# would just write duplicate observations and double the request rate against an unofficial
# API. Queue instead of cancelling: a run already talking to FPL should finish cleanly.
concurrency:
  group: ingest-bronze
  cancel-in-progress: false

jobs:
  fpl:
    name: FPL -> Bronze
    runs-on: ubuntu-latest
    # A normal run is ~15s. This is a stuck-network guard, not a budget — it exists so a
    # hung request cannot sit on a runner for six hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Pinned minor, not "3.x": this job runs unattended, and a silent interpreter bump
          # is not something we want to discover from a failed 06:00 run.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ingest/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The selection rule is pure and hits no network (see ingest/fpl/gameweeks.py), so it
      # is cheap to assert before spending an AWS credential or an FPL request on the run.
      - name: Unit tests
        run: pytest -q

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INGEST_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: ingest-bronze-${{ github.run_id }}

      - name: Load FPL into Bronze
        env:
          # Presence of this variable is what switches the pipeline from a local dry run to
          # S3 (see ingest/run_fpl.py). If the repo variable were ever unset, the job would
          # quietly write to the runner's disk and report success — so assert it first.
          PITCH_CONTROL_LAKE_BUCKET: ${{ vars.PITCH_CONTROL_LAKE_BUCKET }}
          # Bound through the environment rather than interpolated into the script with
          # ${{ }}. `workflow_dispatch` inputs are attacker-controlled text as far as the
          # runner is concerned, and direct interpolation would splice them into the shell
          # before bash ever quotes them — the standard Actions script-injection footgun.
          # Dispatch here needs write access, so this is defence in depth, not a live hole.
          BACKFILL: ${{ inputs.backfill }}
        run: |
          set -euo pipefail
          if [ -z "${PITCH_CONTROL_LAKE_BUCKET}" ]; then
            echo "::error::PITCH_CONTROL_LAKE_BUCKET repo variable is not set — refusing to run."
            echo "Set it to the lake bucket name (terraform output -raw lake_bucket)."
            exit 1
          fi
          if [ -n "${BACKFILL}" ]; then
            # Quoted, so it arrives as one argv entry; run_fpl.py validates the format and
            # rejects anything outside GW 1-38.
            python run_fpl.py --backfill "${BACKFILL}"
          else
            python run_fpl.py
          fi
