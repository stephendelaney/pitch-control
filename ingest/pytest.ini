[pytest]
# `ingest/` is the import root, so `from fpl.gameweeks import ...` resolves the same way in
# the tests as it does in run_fpl.py — no sys.path juggling, no packaging ceremony.
#
# `.github/scripts` is on the path too, so `ops_ledger` (ADR-0025) is testable. That script is
# shared by three jobs across two Python environments and belongs to neither, but this is the
# repo's only pytest runner — so its tests live here rather than nowhere. `ingest-check.yml`
# watches the script's path for the same reason.
pythonpath = . ../.github/scripts
testpaths = tests
